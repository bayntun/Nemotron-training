[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# eval/grader.py is a VERBATIM port of the Kaggle scoring kernel.
# Do not "fix" stylistic issues there -- they may match upstream exactly.
"eval/grader.py" = ["E741"]
# Test discovery imports may look unused but are part of pytest collection.
"**/test_*.py" = ["E741"]
"**/conftest.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["eval", "solvers", "train", "submit", "teacher"]
python_files = ["test_*.py"]
