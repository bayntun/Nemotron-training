# Launch (example): accelerate launch --config_file configs/accelerate_zero2.yaml train/sft.py ...
#
# Set num_processes to match GPU count on the training server.

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
mixed_precision: fp16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
deepspeed_config_file: configs/deepspeed_zero2.json
